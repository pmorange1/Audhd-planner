<header class="hud"><div class="who" id="lvl"></div><div class="xpbar"><i id="xpf"></i></div><div class="chips"><button class="mute-btn" id="mbtn" data-a="mute" title="Toggle sound">&#128266;</button><span class="chip mk" id="cm"><i></i><b id="mks">0</b></span><span class="chip km" id="ck"><i></i><b id="kmv">0 km</b></span></div></header>
<main id="app"></main>

<div class="modal" id="modal" hidden><div class="dlg" role="dialog" aria-modal="true"><div id="mb"></div></div></div>
<script>
(function(){
var KEY="stronghold-v1",LAP=0,$=function(i){return document.getElementById(i)};
function pad(n){return String(n).padStart(2,"0")}
function fmtKey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parseKey(s){var p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])}
function today(){return fmtKey(new Date())}
function wk(){return[0,6].indexOf(new Date().getDay())>-1}
function fresh(){return{day:today(),tier:"green",convoy:false,done:{},tkm:0,mks:0,km:0,bonus:0,hlog:[],xp:{},claimed:{},wishlist:{},stopNotes:{},grandPick:"",off:wk(),muted:false,hist:{},customDuties:{},fieldMood:""}}
var S=fresh(),V="today",prev={},fx=0,up="",celeb="",repMode="week",calDate=new Date(),selDay=today(),wishOnly=false,lastFocus=null;
try{var p=JSON.parse(localStorage.getItem(KEY)||"null");if(p)for(var k in p)S[k]=p[k]}catch(e){}
["done","xp","claimed","wishlist","stopNotes","hist","customDuties"].forEach(function(k){if(!S[k])S[k]={}});
if(!S.hlog||!S.hlog.push)S.hlog=[];S.km=S.km||0;S.tkm=S.tkm||0;S.bonus=S.bonus||0;S.mks=S.mks||0;S.grandPick=S.grandPick||"";S.muted=!!S.muted;

function syncHist(){
 S.hist[S.day]={km:S.tkm,done:Object.keys(S.done).length,hmin:S.hlog.reduce(function(a,b){return a+b.m},0),hlog:S.hlog.slice(),tier:S.tier};
}
if(S.day!==today()){syncHist();S.day=today();S.done={};S.hlog=[];S.bonus=0;S.tkm=0;S.off=wk();S.fieldMood=""}
syncHist();
function save(){syncHist();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

var AC=null;
function beep(type){
 if(S.muted)return;
 try{
  if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended")AC.resume();
  var now=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);
  if(type==="knock"){o.type="triangle";o.frequency.setValueAtTime(190,now);o.frequency.exponentialRampToValueAtTime(75,now+0.08);g.gain.setValueAtTime(0.18,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.09);o.start(now);o.stop(now+0.1)}
  else if(type==="mark"){o.type="sine";o.frequency.setValueAtTime(523.25,now);o.frequency.setValueAtTime(659.25,now+0.08);o.frequency.setValueAtTime(783.99,now+0.16);g.gain.setValueAtTime(0.12,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.35);o.start(now);o.stop(now+0.36)}
  else if(type==="bell"){o.type="sine";o.frequency.setValueAtTime(329.63,now);g.gain.setValueAtTime(0.14,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.7);o.start(now);o.stop(now+0.72)}
 }catch(e){}
}

var TIERS=[{id:"green",n:"Green",s:"Full charge",w:"100%",c:"--green"},{id:"amber",n:"Amber",s:"Foggy",w:"60%",c:"--amber"},{id:"red",n:"Red",s:"Empty tank",w:"25%",c:"--red"}];
var HE={id:"hearth",e:"&#9749;",n:"Light the Hearth",d:"Feet down, water, matcha or tea, audio on.",m:10},PA={id:"patrol",e:"&#128062;",n:"Perimeter Patrol",d:"Walk Nova before 4 PM. Check the horses and chickens.",m:45};

 h+='<svg viewBox="0 0 320 52" class="rail" role="img" aria-label="Progress to the next stop"><line x1="22" y1="40" x2="298" y2="40" style="stroke:var(--line)" stroke-width="5" stroke-linecap="round"/><line x1="22" y1="40" x2="'+x+'" y2="40" style="stroke:var(--tier)" stroke-width="5" stroke-linecap="round"/><g transform="translate('+x+' 22) scale(.9)" style="color:var(--tier)"><circle cx="0" cy="-1" r="16" style="fill:var(--surf);stroke:var(--tier)" stroke-width="2.5"/><circle cx="1" cy="-10" r="3.2" fill="currentColor"/><path d="M1 -6 L-1 2 M-1 2 L-6 8 M-1 2 L4 6 L3 12 M1 -5 L-5 -1 L-8 -4 M1 -5 L6 -3 L9 1" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></svg>';
 h+=(b?'<p style="margin:0"><b>'+nf(CUM[i+1]-S.km)+' km</b> to '+b.n+' ('+nf(a.d)+' km stretch)</p>':'<p style="margin:0"><b>Journey complete.</b> You are home.</p>')+'<div style="margin-top:10px"><button class="btn" data-a="jumpcur">Jump to Current Stop ('+a.n+')</button></div></div>';
 LEGS.forEach(function(g,l){var d=0,j;for(j=LS[l];j<=LE[l];j++)d+=STOPS[j].d;var dn=Math.max(0,Math.min(d,S.km-CUM[LS[l]]));
  h+='<details id="leg-'+l+'"'+(l===cl?' open':'')+'><summary>'+g[0]+'<small style="display:block;color:var(--mute);font-weight:600">'+nf(dn)+' of '+nf(d)+' km · '+(LE[l]-LS[l]+1)+' stops</small></summary><div class="mini" style="--c:var(--tier);margin-bottom:6px"><i style="width:'+(d?dn/d*100:0)+'%"></i></div>';
  for(j=LS[l];j<=LE[l];j++){var s=STOPS[j],nx=STOPS[j+1],ws=!!S.wishlist[j],nt=S.stopNotes[j];h+='<div id="stop-'+j+'" class="lm'+(j<i?' on':'')+(j===i?' cur':'')+'"><span class="lm-main" data-a="stopinfo" data-id="'+j+'"><b>'+(j<i?'&#10003; ':'')+flag(s.c)+' '+s.n+(nt?' &#128221;':'')+'</b>'+(s.p?' <small style="display:inline">pit stop</small>':'')+(nx?'<small>to '+nx.n+'</small>':'<small>Finish</small>')+'</span><span class="lm-r"><span class="lm-d">'+(nx?nf(s.d)+' km':'Home')+'</span><button class="wish-btn" data-a="wish" data-id="'+j+'" aria-pressed="'+ws+'" title="Toggle wishlist">'+(ws?'&#9733;':'&#9734;')+'</button></span></div>'}
  h+='</details>'});
 return h}

function exploredList(){var i=where(S.km),out=[],j;for(j=0;j<=i;j++){if(wishOnly&&!S.wishlist[j])continue;out.push({idx:j,s:STOPS[j],w:!!S.wishlist[j]})}out.sort(function(a,b){return(b.w?1:0)-(a.w?1:0)});return out}
function vHobbies(){var nx=RW.filter(function(r){return!S.claimed[r[0]]})[0],h='<h2>Hobby hub</h2><p class="sub">Every 60 minutes earns a Mark, and Marks are never spent. Log quick blocks or custom minutes with a session note.</p>';
 if(nx)h+='<div class="panel" style="--c:var(--gem)"><b>Next reward: '+nx[2]+'</b><div class="mini"><i style="width:'+Math.min(100,S.mks/nx[0]*100)+'%"></i></div><small style="color:var(--mute)">'+(S.mks>=nx[0]?"Ready to claim in the chest below.":(nx[0]-S.mks)+" Marks to go ("+S.mks+" of "+nx[0]+")")+'</small></div>';
 h+='<div class="list">'+HOB.map(function(a){var x=S.xp[a.id]||0,logs=S.hlog.filter(function(l){return l.id===a.id}),t=logs.reduce(function(s,l){return s+l.m},0);
  var jhtml=logs.filter(function(l){return l.n}).map(function(l){return'<div><span>&#128221; '+l.n+'</span><span>'+l.m+'m</span></div>'}).join("");
  return'<div class="card hc" style="--c:'+a.c+'"><span class="em">'+a.e+'</span><span><b>'+a.n+'</b><small>'+a.d+'</small><small class="got">'+(t?t+" min today. ":"")+(60-x%60)+' min to the next Mark</small><div class="mini"><i style="width:'+(x%60)/60*100+'%"></i></div></span><div class="acts2"><button class="btn" data-a="hlog" data-id="'+a.id+'" data-m="30">+30 min</button><button class="btn" data-a="hlog" data-id="'+a.id+'" data-m="60">+60 min</button>'+(t?'<button class="link" data-a="hundo" data-id="'+a.id+'">Undo</button>':'')+'<div class="cust-row"><input type="number" min="5" max="300" value="20" id="cm-'+a.id+'" aria-label="Custom minutes"><input type="text" placeholder="Session note (patch, route, fold...)" id="cn-'+a.id+'"><button class="btn" data-a="hcust" data-id="'+a.id+'">Log</button></div>'+(jhtml?'<div class="jlog" style="width:100%">'+jhtml+'</div>':'')+'</div></div>'}).join("")+'</div>';
 h+='<h2>Reward chest</h2><p class="sub">Rewards unlock as your Marks grow. Claiming costs nothing, and high thresholds keep spending rare.</p><div class="list">'+RW.map(function(r){var c=S.claimed[r[0]],ok=S.mks>=r[0],isGrand=r[0]===750;
  if(isGrand){
   var ex=exploredList(),opts=ex.map(function(o){var lbl=flag(o.s.c)+' '+o.s.n+(o.w?' (Wishlist)':'');return'<option value="'+o.s.n+'"'+(S.grandPick===o.s.n?' selected':'')+'>'+lbl+'</option>'}).join("");
   return'<div class="panel" style="--c:#b87a0a"><div class="ph"><span class="em" style="--c:#b87a0a">'+r[1]+'</span><span><b>'+r[2]+'</b><small style="display:block;color:var(--mute);font-size:13px">At '+r[0]+' Marks · '+ex.length+' matching explored stop'+(ex.length===1?'':'s')+'</small></span></div>'
    +(ok?'<div class="gp-box"><button class="link" style="justify-self:start" data-a="wishfilt">'+(wishOnly?'Showing Wishlist Only (Show All Explored)':'Showing All Explored (Filter Wishlist Only)')+'</button><select class="gp-sel" id="gp-sel" data-a="gpick"><option value="">Choose an explored location for your treat...</option>'+opts+'</select>'+(c?'<span class="pay" style="--c:var(--mute)">Claimed: '+(S.grandPick||'Chosen')+'</span>':btn("claim",r[0],"Claim Grand Prize","",!S.grandPick))+'</div>':'<div class="gp-box"><small style="color:var(--mute)">Locked until '+r[0]+' Marks. Wishlisted &amp; explored stops will appear here.</small></div>')+'</div>';
  }
  return card({e:r[1],c:"#6a4cd6",n:r[2],d:"At "+r[0]+" Marks",r:c?'<span class="pay" style="--c:var(--mute)">Claimed</span>':btn("claim",r[0],ok?"Claim":"Locked","",!ok)})}).join("")+'</div>';return h}

function objFor(a,n){var idx=Math.min(a.obj.length-1,Math.floor(n/2.6));return a.obj[idx]}
function vSkills(){return'<h2>Skill trees</h2><p class="sub">Ten ranks per skill (200 hours to Master), with difficulty, mastery likelihood, and timescales.</p>'+SK.map(function(a){var x=S.xp[a.id]||0,n=rk(a.id),nx=TH[n],pv=n?TH[n-1]:0,fr=nx?(x-pv)/(nx-pv):1,pp=n?Math.min(100,((n-1)+(nx?fr:1))/9*100):0;
 return'<div class="panel" style="--c:'+a.c+'"><div class="ph"><span class="em">'+a.e+'</span><span><b>'+a.n+'</b><small style="display:block;color:var(--mute);font-size:13px">'+(n?RN[n-1]:"Unranked")+' · '+hm(x)+' practised</small></span></div><div class="goal" style="margin-top:10px;--c:'+a.c+'"><b>Current Learning Objective</b>'+objFor(a,n)+'</div><div class="path" style="--p:'+pp+'%">'+RN.map(function(r,i){return'<i class="nd'+(i<n?" on":"")+(i===n?" nxt":"")+'">'+(i+1)+'</i>'}).join("")+'</div><small style="color:var(--mute)">'+(nx?"Next: "+RN[n]+" in "+hm(nx-x):"Mastery reached.")+'</small><div class="meta-grid"><div class="meta-box"><b>Difficulty</b>'+a.diff+'</div><div class="meta-box"><b>Likelihood</b>'+a.likely+'</div><div class="meta-box"><b>Pace &amp; Scale</b>'+a.pace+' · '+a.scale+'</div></div></div>'}).join("")}

function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()),diff=(x.getDay()+6)%7;x.setDate(x.getDate()-diff);return x}
function vReports(){
 var y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),offset=(first+6)%7;
 var mName=calDate.toLocaleString("en-GB",{month:"long",year:"numeric"});
 var cal='<div class="panel"><div class="cal-head"><button class="btn" data-a="calprev">&larr;</button><b>'+mName+'</b><button class="btn" data-a="calnext">&rarr;</button></div><div class="cal-grid">';
 ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(function(d){cal+='<div class="cal-dow">'+d+'</div>'});
 for(var i=0;i<offset;i++)cal+='<div></div>';
 for(var d=1;d<=days;d++){
  var ds=y+"-"+pad(m+1)+"-"+pad(d),hd=S.hist[ds],isT=ds===today(),isS=ds===selDay;
  var tag="";
  if(hd){if(hd.hmin>=60)tag="&#9733; "+Math.round(hd.km)+"k";else if(hd.km||hd.hmin)tag=Math.round(hd.km)+"k"}
  cal+='<button class="cal-day'+(isT?' today':'')+(isS?' sel':'')+'" data-a="selday" data-id="'+ds+'"><span>'+d+'</span><span class="cal-tag">'+tag+'</span></button>';
 }
 cal+='</div>';
 var sd=S.hist[selDay];
 cal+='<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px"><b>'+selDay+'</b>: '+(sd?nf(sd.km)+' km · '+sd.done+' tasks · '+sd.hmin+'m hobbies':'No activity logged.')+'</div></div>';

 var mon=mondayOf(new Date()),sun=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+6);
 var keys=Object.keys(S.hist),wKm=0,wTasks=0,wMin=0,wH={},mKm=0,mTasks=0,mMin=0,mH={};
 keys.forEach(function(k){
  var dt=parseKey(k),it=S.hist[k];
  if(dt>=mon&&dt<=sun){
   wKm+=it.km||0;wTasks+=it.done||0;wMin+=it.hmin||0;
   (it.hlog||[]).forEach(function(l){wH[l.id]=(wH[l.id]||0)+l.m});
  }
  if(dt.getFullYear()===y&&dt.getMonth()===m){
   mKm+=it.km||0;mTasks+=it.done||0;mMin+=it.hmin||0;
   (it.hlog||[]).forEach(function(l){mH[l.id]=(mH[l.id]||0)+l.m});
  }
 });
 var isW=repMode==="week",rKm=isW?wKm:mKm,rT=isW?wTasks:mTasks,rM=isW?wMin:mMin,rH=isW?wH:mH;
 var rep='<div class="seg"><button data-a="repmode" data-id="week" aria-pressed="'+isW+'">This Week (Mon–Sun)</button><button data-a="repmode" data-id="month" aria-pressed="'+!isW+'">'+calDate.toLocaleString("en-GB",{month:"short"})+' Report</button></div>'
  +'<div class="rep-grid">'
  +'<div class="rep-stat"><b>'+nf(rKm)+' km</b><small>Distance walked</small></div>'
  +'<div class="rep-stat"><b>'+rT+'</b><small>Tasks completed</small></div>'
  +'<div class="rep-stat"><b>'+hm(rM)+'</b><small>Hobby time</small></div>'
  +'<div class="rep-stat"><b>'+Math.floor(rM/60)+'</b><small>Marks earned</small></div>'
  +'</div>';
 var hList=HOB.map(function(a){return rH[a.id]?'<div><span>'+a.e+' '+a.n+'</span><b>'+hm(rH[a.id])+'</b></div>':''}).join("");
 if(hList)rep+='<div class="panel"><b style="display:block;margin-bottom:6px">'+(isW?'Weekly':'Monthly')+' Hobby Breakdown</b><div class="jlog" style="border:0;padding:0;margin:0">'+hList+'</div></div>';
 return'<h2>Calendar &amp; Reports</h2><p class="sub">Active date: <b>'+today()+'</b>. Inspect any day or compare weekly and monthly totals.</p>'+cal+rep;
}

function vCharter(){return'<h2>The Charter</h2><p class="sub">You are the Keeper of the Stronghold. Your daily upkeep carries you around the globe. Your hobbies build mastery.</p>'
 +'<details open><summary>Two tracks, no trading</summary><p>Tasks earn kilometres on the Eastbound Loop. Hobbies earn Marks, one per hour. Neither is ever locked behind the other.</p></details>'
 +'<details><summary>Law 1: Rest and hobbies are never earned</summary><p>They are always open. Chores move you forward, but they never buy your joy.</p></details>'
 +'<details><summary>Law 2: Action buys blueprints</summary><p>No planning, spreadsheets or gear research until one physical task is done.</p></details>'
 +'<details><summary>Law 3: The 8 PM curfew</summary><p>Work and tasks close. Protected time with Georgie.</p></details>'
 +'<div class="foot"><button class="btn" data-a="tweaks">Customise Tasks</button><button class="btn" data-a="backup">Backup / Restore</button></div>'
 +'<div class="foot"><button class="btn" data-a="reset">Fresh day</button><button class="btn danger" data-a="wipe">Hard reset</button></div>'}

function openModal(html,trigger){
 lastFocus=trigger||document.activeElement;
 $("mb").innerHTML=html;$("modal").hidden=false;document.body.style.overflow="hidden";
 var f=$("mb").querySelector("input,textarea,button");if(f)f.focus();
}
function closeModal(){
 $("modal").hidden=true;document.body.style.overflow="";
 if(lastFocus&&lastFocus.focus){lastFocus.focus();lastFocus=null}
}

function render(){var t=tierDef();document.documentElement.style.setProperty("--tier","var("+t.c+")");
 var lv=lvOf(S.km);$("lvl").textContent="Travel Rank "+lv+" \u00b7 "+lname(lv);$("xpf").style.width=lprog(S.km)*100+"%";
 $("mks").textContent=S.mks;$("kmv").textContent=nf(S.km)+" km";
 $("mbtn").innerHTML=S.muted?"&#128263;":"&#128266;";
 [["cm",S.mks],["ck",Math.round(S.km)]].forEach(function(q){if(prev[q[0]]!==undefined&&prev[q[0]]!==q[1]){var c=$(q[0]);c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump")}prev[q[0]]=q[1]});
 var body={today:vToday,journey:vJourney,hobbies:vHobbies,skills:vSkills,reports:vReports,charter:vCharter}[V]();
 $("app").innerHTML=(V==="today"?'<p class="say">'+banner()+'</p>':'')+body;
 if(V==="reports")$("app").innerHTML+='<div class="foot"><button class="btn" data-a="view" data-id="charter">View Stronghold Charter &amp; Settings</button></div>';
 $("nav").innerHTML=[["today","Today"],["journey","Journey"],["hobbies","Hobbies"],["skills","Skills"],["reports","Calendar"]].map(function(n){return'<button data-a="view" data-id="'+n[0]+'"'+(V===n[0]?' aria-current="page"':'')+'>'+n[1]+'</button>'}).join("")}

function act(a,id,x,el){
 if(a==="view"){V=id;render();window.scrollTo(0,0);return}
 if(a==="mute"){S.muted=!S.muted;save();render();return}
 if(a==="clrcel"){celeb="";render();return}
 if(a==="tier")S.tier=id;
 else if(a==="convoy")S.convoy=!S.convoy;
 else if(a==="off")S.off=!S.off;
 else if(a==="duty"){var d=DL(S.tier).filter(function(q){return q.id===id})[0],on=!S.done[id];if(on){S.done[id]=1;addKm(K(d.m));beep("knock");say("+"+K(d.m)+" km. "+d.n+" complete.")}else{delete S.done[id];addKm(-K(d.m))}}
 else if(a==="bonus"){S.bonus++;addKm(K(45));beep("knock");say("+"+K(45)+" km. Bonus block logged.")}
 else if(a==="unbonus"){S.bonus--;addKm(-K(45))}
 else if(a==="rest"){beep("bell");say("Rest taken. No cost, no guilt.")}
 else if(a==="dice"){var pick=HOB[Math.floor(Math.random()*HOB.length)];S.fieldMood="Try "+pick.n+": "+objFor(pick,rk(pick.id));beep("knock");say("Rolled: "+pick.n)}
 else if(a==="wish"){if(S.wishlist[id])delete S.wishlist[id];else{S.wishlist[id]=1;beep("knock");say("Added "+STOPS[id].n+" to your wishlist.")}}
 else if(a==="jumpcur"){var cur=where(S.km),leg=0;LS.forEach(function(s,l){if(cur>=s&&cur<=LE[l])leg=l});render();var det=$("leg-"+leg);if(det)det.open=true;var row=$("stop-"+cur);if(row)row.scrollIntoView({behavior:"smooth",block:"center"});return}
 else if(a==="stopinfo"){
  var st=STOPS[id],nt=S.stopNotes[id]||"";
  openModal('<h3>'+flag(st.c)+' '+st.n+'</h3><p>Distance from London: '+nf(CUM[id])+' km. '+(STOPS[+id+1]?'Next stretch: '+nf(st.d)+' km to '+STOPS[+id+1].n+'.':'Final stop!')+'</p>'
   +'<label style="display:block;font-size:13px;font-weight:800;margin-bottom:4px">Travel / Grand Prize Note</label>'
   +'<textarea class="inp" id="st-note" rows="3" placeholder="e.g. Boutique hotel, local food, or treat idea...">'+nt+'</textarea>'
   +'<div class="row" style="margin-top:12px"><button class="btn" data-a="savestop" data-id="'+id+'">Save Note</button><button class="btn" data-a="cancel">Close</button></div>',el);
  return;
 }
 else if(a==="savestop"){S.stopNotes[id]=$("st-note").value.trim();closeModal();say("Stop note saved.")}
 else if(a==="wishfilt"){wishOnly=!wishOnly;render();return}
 else if(a==="hlog"){var m=+x;S.hlog.push({id:id,m:m});var dm=hob(id,m);say(dm>0?"+"+dm+" Mark"+(dm>1?"s":"")+". "+m+" minutes logged.":m+" minutes logged.")}
 else if(a==="hcust"){var m=Math.max(5,Math.min(300,+$("cm-"+id).value||20)),n=$("cn-"+id).value.trim();S.hlog.push({id:id,m:m,n:n});var dm=hob(id,m);say(dm>0?"+"+dm+" Mark. "+m+"m logged.":m+"m logged.")}
 else if(a==="hundo"){for(var i=S.hlog.length-1;i>=0;i--)if(S.hlog[i].id===id){var u=S.hlog[i].m;S.hlog.splice(i,1);hob(id,-u);break}}
 else if(a==="claim"){S.claimed[id]=1;beep("mark");say("Reward claimed. Go and enjoy it.")}
 else if(a==="calprev"){calDate.setMonth(calDate.getMonth()-1)}
 else if(a==="calnext"){calDate.setMonth(calDate.getMonth()+1)}
 else if(a==="selday"){selDay=id}
 else if(a==="repmode"){repMode=id}
 else if(a==="tweaks"){
  var rows=DL(S.tier).map(function(d){return'<div style="margin-bottom:8px"><small style="font-weight:800">'+d.n+'</small><div style="display:flex;gap:6px"><input class="inp" id="tn-'+d.id+'" value="'+d.n+'"><input class="inp" style="width:80px" type="number" id="tm-'+d.id+'" value="'+d.m+'"></div></div>'}).join("");
  openModal('<h3>Customise Tasks</h3><p>Rename tasks or adjust their minutes.</p>'+rows+'<div class="row"><button class="btn" data-a="savetweaks">Save</button><button class="btn" data-a="cancel">Cancel</button></div>',el);return;
 }
 else if(a==="savetweaks"){DL(S.tier).forEach(function(d){S.customDuties[d.id]={n:$("tn-"+d.id).value.trim()||d.n,m:Math.max(5,+$("tm-"+d.id).value||d.m)}});closeModal();say("Tasks updated.")}
 else if(a==="backup"){
  var j=JSON.stringify(S);
  openModal('<h3>Backup &amp; Restore</h3><p>Copy, download, or paste a JSON backup to restore.</p><textarea class="inp" id="bk-txt" rows="5">'+j+'</textarea><div class="row" style="margin-top:12px"><button class="btn" data-a="copybk">Copy</button><button class="btn" data-a="dlbk">Download</button><button class="btn" data-a="restore">Restore</button><button class="btn" data-a="cancel">Close</button></div>',el);return;
 }
 else if(a==="copybk"){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText($("bk-txt").value).then(function(){say("Backup copied to clipboard.")},function(){say("Select and copy manually.")});else say("Select and copy manually.");return}
 else if(a==="dlbk"){var blob=new Blob([$("bk-txt").value],{type:"application/json"}),url=URL.createObjectURL(blob),aEl=document.createElement("a");aEl.href=url;aEl.download="stronghold-backup-"+today()+".json";aEl.click();URL.revokeObjectURL(url);say("Backup downloaded.");return}
 else if(a==="restore"){try{var obj=JSON.parse($("bk-txt").value);if(obj&&typeof obj.km==="number"){S=obj;closeModal();say("Backup restored!")}}catch(e){say("Invalid JSON backup.")}}
 else if(a==="reset"){S.done={};S.hlog=[];S.bonus=0;S.tkm=0}
 else if(a==="wipe"){openModal('<h3>Delete everything?</h3><p>This erases all Marks, kilometres, wishlist stops, skill progress and your Travel Rank. It cannot be undone.</p><div class="row"><button class="btn" data-a="cancel">Keep progress</button><button class="btn danger" data-a="hardreset">Delete everything</button></div>',el);return}
 else if(a==="cancel"){closeModal();return}
 else if(a==="hardreset"){S=fresh();prev={};V="today";closeModal();say("Fresh start. Your adventure begins again.")}
 save();render();if(up)say(up);if(fx||up)burst();fx=0;up=""}

document.addEventListener("click",function(e){var t=e.target.closest("[data-a]");if(t&&!t.disabled&&t.tagName!=="SELECT")act(t.dataset.a,t.dataset.id,t.dataset.m,t)});
document.addEventListener("change",function(e){if(e.target&&e.target.id==="gp-sel"){S.grandPick=e.target.value;save();render()}});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("modal").hidden)closeModal()});
setInterval(function(){if(V==="today"){var s=document.querySelector(".say");if(s)s.textContent=banner()}},60000);
render();
})();
</script>
</body>
</html>
