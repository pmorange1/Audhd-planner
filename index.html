var SIG=["Autism and ADHD often occur together. Many people find out as adults.","Masking, hiding your natural ways to fit in, is exhausting. Safe spaces make unmasking possible.","Many people with AuDHD describe wanting routine and novelty at the same time. Both are real.","Motivation often follows interest rather than importance. That is not laziness.","Clear, literal communication helps everyone. Say what you mean and what you need.","Sensory differences vary. Noise, light and texture can be painful or deeply enjoyable.","Strengths often include deep focus, pattern spotting, honesty and creativity.","Rest is not a reward you earn. Everyone needs recovery, especially after masking.","Support looks different for everyone. Ask, do not assume.","Being different is not being broken. Acceptance changes lives."];

var RV=[{w:0,q:"Who has been writing these letters?",o:["A forger copying Marlowe","Marlowe herself","A rival mapmaker"],a:1,t:"The letters are Marlowe's. She stamped every one herself, and she is not missing: she is leading you. Your first job was to notice, and you already have."},{w:2,q:"What is the grey seal?",o:["A calling card for whoever is rewriting the letters","A decorative postal mark","Marlowe's code for danger"],a:0,t:"Someone has been rewriting the letters. Lines that said 'be gentler with yourself' now say 'try harder to fit in'. The tamperer leaves a grey seal and calls itself the Hush."},{w:3,q:"Why is the Hush rewriting the letters?",o:["He wants fame","He is afraid for people like himself","He works for the post office"],a:1,t:"The Hush is a person: Aldous Vane, Marlowe's old research partner. He believes quiet sameness is kindness because masking nearly broke him. He is not trying to hurt anyone. He is trying to spare them."},{w:6,q:"What is the route really for?",o:["Winning against Vane","Reaching Vane with understanding","Selling maps"],a:1,t:"Marlowe built the route to reach Vane, not to defeat him. Every stamp is an invitation, and every field assignment is a small act of love sent into the world."},{w:4,q:"What relights a Signal Tower?",o:["Money","Someone sharing what they wish others understood","Perfect behaviour"],a:1,t:"The Signal Towers are real: places where people say what they wish others understood. Each awareness act you do relights one, and the Hush's grey seals fade a little more."},{w:0,q:"Who were the letters written for?",o:["Vane","You, the traveller","The Hush"],a:1,t:"Marlowe's last log reads: 'I did not vanish. I stepped back so the route could be yours. The letters were never only for Vane. They were for whoever needed them most.'"},{w:5,q:"How does the story end?",o:["Vane is defeated","Vane drops the mask and writes his own letter","The letters are burned"],a:1,t:"In London, Vane writes a letter of his own, unmasked and unedited. The route ends where acceptance begins: first for him, then for you, then for everyone you reach. Keep sending the signal."}];

var BEAT={"London": [1, "Tomas hands you an envelope stamped with a date six years ago. 'Marlowe posted it before she left,' he says. 'She told me to give it to whoever finally asked the right question.' You have not asked a question yet. You are, however, extremely polite, and Tomas says that counts."], "Paris": [0, "Dr Marlowe's first letter: 'If you are reading this, you found the loop. Good. I could not map the quiet parts of my mind, so I mapped the world instead. Eight towers are dark. Each stamp is a candle. Do not hurry. The pigeon never does.'"], "Valletta": [1, "At the end of the first leg, Tomas notices every envelope carries the same watermark: a compass rose with one point missing. 'Someone cut a corner off this,' he says. 'Marlowe never wasted paper, and she never cut corners. Literally or otherwise.'"], "Sarajevo": [2, "Priya recognises the grey seal. It is the mark of the Hush, a campaign of letters telling people to be quieter, smaller and easier. 'It is not magic,' she says. 'It is just very persuasive stationery.'"], "Bucharest": [3, "Kofi finds two versions of the same letter in the archive. One says 'be gentle with yourself'. The other says 'try harder to fit in'. The handwriting matches. 'Someone is editing her,' he says, 'with a ruler.'"], "Moscow": [2, "At the post office, a clerk admits every grey-sealed letter was sent by the same man. He always buys exactly one stamp, always pays politely, and always apologises to the stamp."], "Tbilisi": [3, "The visitor book gives the name: A. Vane. Kofi goes pale, then alphabetical. 'Aldous Vane was Marlowe's research partner,' he whispers. 'They stopped speaking after the Great Silence Conference. Nobody knows why.'"], "Beirut": [2, "Priya decodes the Hush's letters. They are copied from Marlowe's drafts, trimmed so every kind sentence sounds like an order. 'He is not inventing anything,' she says. 'He is editing out the joy.'"], "Sana'a": [3, "A note arrives, signed by Vane: 'I am not your enemy. I am a man who was exhausted for thirty years and decided nobody else should be.' It is the first honest sentence the Hush has sent. Kofi files it under 'Complicated'."], "Cairo": [6, "Lucía sits you down with soup and an old photograph: Marlowe and Vane, young, laughing, both in identical grey coats. 'He was not always grey,' she says. 'He just got tired of being the only colour in the room.'"], "Dakar": [3, "Kofi finally understands. Marlowe's route was never meant to stop Vane. Every stop is a conversation she did not get to finish. 'It is an invitation,' he says, 'not a trap. And the postage is outrageous.'"], "Cape Town": [6, "At the southern end of the continent, Lucía finds a seed packet in Marlowe's handwriting: 'Plant where it is hard.' You do not plant it. You write it down and carry it, which Lucía says is the same thing, with fewer worms."], "Mumbai": [4, "Yuki calls from a lighthouse with news. The Signal Towers are real: eight old transmitters Marlowe and Vane built together to broadcast one message, 'You are allowed.' The Hush has been switching them off, one by one."], "Tokyo": [7, "Sef plays a tune on a tiny keyboard that matches a pattern in Marlowe's margin notes. 'Her notes are a melody,' he says. 'Play them in order and they open the next tower.' It sounds, honestly, a bit like a kettle."], "Manila": [4, "A tower lights. The sky does not explode, but a stranger on the street smiles at you for no reason, which feels like the same thing. Yuki logs it: 'Tower three: working. Gull: smug.'"], "Majuro": [0, "A faded cassette, Marlowe's voice: 'If you have reached the Pacific, you are tired. Good. Tired is where honest begins. Tomas will deny that he is the pigeon's best friend. He is.'"], "Sydney": [7, "Sef finds the seventh letter pinned under a tuning fork. It is addressed not to Vane or to the world but to 'whoever keeps reading the margins'. 'That is you,' Sef says. 'You are the margins. Congratulations. It is a lot of margin.'"], "Easter Island": [4, "At the end of the sea, Yuki finds Marlowe's logbook with the last page torn out. The torn edge matches the missing corner on every watermark. 'She split the map,' says Yuki, 'so no single person could carry all of it. Clever. Slightly annoying.'"], "Havana": [7, "A train is waiting in the Americas. There is a ticket in Marlowe's handwriting and a note: 'If Vane comes, offer him tea. Do not offer him advice.' Sef offers the train a song. The train does not reply. Trains rarely do."], "Washington, D.C.": [6, "Lucía has made soup for fifty, and the Hush arrives for one bowl. Vane is quiet, polite and visibly shaking. 'I did not come to stop you,' he says. 'I came because nobody has ever asked me what I needed.'"], "Halifax": [5, "Vane unfolds a letter he has kept for twenty years: Marlowe's reply to his resignation. 'Aldous, I loved the quiet in you. I only wished you would let it speak.' He reads it aloud, and for the first time the grey seal on his coat looks like a very small, very tired badge."]},END=[1, "London again. There is an envelope on the doormat, addressed to you in Vane's handwriting, and it is not grey. 'Dear Traveller,' it begins, 'I am writing this without editing it.' Tomas swears he did not cry. The pigeon was seen nodding."],PZ=[["Cipher", "Marlowe's margin shows a row of letters: VLJQDO. Tomas says every letter was bumped three places along the alphabet. What is the word?", ["signal"], "Move each letter back three places.", "SIGNAL. Marlowe's loop is a signal, not just a route."], ["Anagram", "Priya unscrambles an envelope label: RETSOW. 'Marlowe built eight of these,' she says. What are they?", ["towers"], "Eight tall things that carry a message.", "TOWERS. Eight Signal Towers, built to say one thing: you are allowed."], ["Sequence", "Kofi has numbered the letters in the archive: 1, 1, 2, 3, 5, 8, ... What comes next? Write it as a word. (It is also the number of a missing page.)", ["thirteen", "13"], "Each number is the sum of the two before it.", "THIRTEEN. Page thirteen was never lost. It was posted."], ["Riddle", "Lucía's riddle: I have a face but no eyes, and hands but no arms. Tomas is never on time for me. What am I?", ["clock", "watch"], "Tomas checks it constantly. It disagrees with him.", "A CLOCK. Tomas's watch runs forty minutes slow, on purpose. Marlowe taught him that late is a point of view."], ["Odd one out", "Yuki lists four things: Lighthouse, Beacon, Signal Tower, Soup Ladle. Which one does not belong?", ["soupladle", "ladle"], "Lucía would argue it belongs. She would be wrong.", "THE SOUP LADLE. Lucía disagrees. Lucía always disagrees."], ["Missing letters", "Sef hums a tune with a gap: P _ G _ O N. Fill in the missing letters to make the word.", ["pigeon"], "It has been following you since the first stamp.", "PIGEON. Of course it is. The pigeon is Marlowe's, and has delivered every letter."], ["The last lock", "Marlowe's final lock reads: 'This route was always written for ___.' One short word. Think about whose margins you have been reading.", ["you", "pip", "traveller", "traveler", "thetraveller", "thetraveler"], "Look in the mirror that was painted over with grey.", "YOU. The route was always written for you."]],LPAL=["#3d6cb9","#b5651d","#c0873f","#2f7d4f","#b83b5e","#1b8fa0","#7b5ea7"];

e wrote: 'ask nicely'."], "CA": ["The needle tower", "Its antenna is drawn like a tuning fork."], "CL": ["A stone head of Rapa Nui", "It faces inland. Everything on the island does, except you."], "ZA": ["Table Mountain", "A cloud sits on top like a tablecloth. Marlowe: 'the world is tidy, sometimes'."], "NL": ["A windmill", "Four sails, four seasons, one very patient miller."]};Object.assign(BEAT,{"Reykjavik": [1, "The compass needle spins in the harbour, then settles firmly on a bakery. Tomas takes this as proof that it points to snacks. Marlowe's margin note, in careful pencil: 'Or to warmth. Same direction, usually.'"], "Berlin": [2, "Priya finds a wall of old letters, each stamped grey, each crossed out in bright pen by someone else. 'He is arguing with himself,' she says. 'Politely, in two colours.'"], "Madrid": [7, "Sef plays a guitar with only five strings. 'The sixth was the Hush's,' he says. Every instrument in the square is missing exactly one string. Whoever did it was extremely tidy."], "Rome": [3, "Kofi spots Marlowe's initials carved small and neat inside the Colosseum, beside a second set scratched out. 'Two people wrote here,' he says. 'One of them rubbed it out. Shame, or fear?'"], "Athens": [3, "In the shadow of the Parthenon, Kofi finds a note folded into a guidebook: 'Ask not what the stones say. Ask what they stopped saying.' It is unclear whether this is a riddle or just good advice."], "Skopje": [2, "Priya's receiver crackles, and for a moment plays something that is not static: a faint hum, eight notes, the opening of a song. It stops the moment she looks at it. Signals can be shy."], "Chișinău": [1, "Tomas delivers a parcel to the wrong door and is invited in for dinner. By dessert the owner has produced a letter Marlowe left with her grandmother. 'Wrong door,' Tomas says, 'right parcel.'"], "Yerevan": [0, "Marlowe's handwriting, smaller than usual: 'I am writing this on a mountain, which is the worst place to write. The ink freezes and the s not to explain."], "New Delhi": [3, "Kofi finds Marlowe's name on a visitor list from twenty years ago, next to Vane's, in a column headed 'Together'. Someone has crossed the column out and added a question mark."], "Kathmandu": [4, "At altitude, Yuki finds a prayer flag with a line of Marlowe's printed in the border: 'Be quiet if you must, but never be silent about who you are.' Several gulls seem moved."], "Singapore": [2, "Priya checks the third tower with a very small multimeter. 'Humming,' she says. 'Happily. Like a fridge that has been told it is doing a good job.'"], "Honiara": [7, "Sef writes a song for the pigeon. It has one verse and a bridge. The bridge is mostly the sound of a pigeon being offended."], "Wellington": [0, "A postcard in Marlowe's hand: 'Aldous and I used to argue about the colour of the sky. He said grey was honest. I said grey was only blue that had given up. We were both right, which was the problem.'"], "Apia": [4, "Yuki lights tower six at dusk. The island answers with a long, low, collective hum. 'That is the sound of many people being allowed,' she says, and blames the salt for her eyes."], "Buenos Aires": [1, "Tomas tries to deliver a parcel to an address that is just a drawing of a door. He knocks anyway. A voice says: 'Come in. We have been expecting someone who knocks.'"], "Lima": [3, "Kofi spots the missing compass corner in a museum case, labelled 'Unidentified Corner, Possibly Important'. A guard asks him to stop alphabetising the exhibits."], "Mexico City": [6, "Lucía serves a soup so good that the Hush's letter in her pocket quietly rewrites itself to say 'carry on'. She claims no credit. She takes seconds."], "Ottawa": [0, "Marlowe, in the margins again: 'If you have come this far, you are in the home stretch, and I owe you an apology. I made the route too long. I wanted you to find out that you could.'"]});RID.push.apply(RID,[["What has one eye but cannot see?", "A needle."], ["What runs but never walks, and murmurs but 16 2 22 6zM32 28c6-8 14-10 22-6-10 0-16 2-22 6z\"/>", "NZ": "<path d=\"M2 58L26 16l10 18 8-10 18 34z\"/>", "AR": "@@AE@@", "UY": "<path d=\"M26 58l3-34h6l3 34z\"/><rect x=\"26\" y=\"16\" width=\"12\" height=\"8\"/><path d=\"M24 16l8-10 8 10z\"/>", "BO": "<path d=\"M2 58L26 16l10 18 8-10 18 34z\"/>", "CO": "<path d=\"M2 58L26 16l10 18 8-10 18 34z\"/>", "VE": "<path d=\"M2 58L26 16l10 18 8-10 18 34z\"/>", "EC": "@@AE@@", "CU": "<path d=\"M12 58V36a20 20 0 0140 0v22z\"/><rect x=\"30\" y=\"4\" width=\"4\" height=\"12\"/><circle cx=\"32\" cy=\"16\" r=\"3\"/>", "HT": "<path d=\"M6 58V30h8v-8h6v8h6v-8h12v8h6v-8h6v8h8v28z\"/><g fill=\"var(--surf)\"><path d=\"M26 58V44a6 6 0 0112 0v14z\"/></g>", "DO": "<path d=\"M10 58V30l8-12 8 12v28zM26 58V22L32 4l6 18v36zM38 58V30l8-12 8 12v28z\"/>", "GT": "@@MX@@", "HN": "@@MX@@", "PA": "<path d=\"M8 58V20h48v38H46V36a14 14 0 00-28 0v22z\"/>", "CR": "<path d=\"M2 58L26 16l10 18 8-10 18 34z\"/>"});Object.assign(MON,{"IE": ["An old stone castle", "Marlowe sketched its door slightly ajar."], "NO": ["A wooden spire", "Snow on the roof, and a note: 'be warm'."], "SE": ["A royal palace", "Hundreds of windows, one drawn lit."], "FI": ["A white cathedral dome", "A gull sits on top as if it owns the place."], "DK": ["A copper spire", "Green with age, like a very patient teapot."], "PL": ["An old town castle", "The clock tower is drawn five minutes late. Tomas approves."], "AT": ["An imperial palace", "Marlowe: 'too many rooms, no quiet one'."], "CZ": ["Spires of a hundred towers", "She counted a hundred and one. Priya says that is not how towers work."], "HU": ["A riverside parliament dome", "It glows gold at night, like a very large lamp."], "PT": ["A riverside tower", "Tide tables are pinned to its door."], "IS": ["A rocket-shaped church", "It looks ready to leave. Marlowe wrote: 'not yet'."], "MT": ["A honey-coloured dome", "Tomas buys a pastry the size of his hat."], "HR": ["A walled harbour town", "She walked the walls twice, the second time backwards."], "BG": ["A golden dome", "The gold leaf blinks in the sun like morse code."], "RO": ["A hilltop castle", "A friendly bat was mistaken for the Hush twice."], "UA": ["Golden domes", "Bells ring in a pattern Sef cannot stop humming."], "BY": ["A pond-side castle", "Reflections are drawn as if real. Kofi files them as 'also real'."], "GE": ["A hillside bath-house dome", "Steam rises like a question mark."], "AM": ["A snow-capped mountain", "Marlowe wrote this one while shivering. It shows."], "AZ": ["Three flame-shaped towers", "At night they flicker. Priya blames the signal."], "LB": ["Roman arches by the sea", "A note on top: 'ask nicely'."], "IQ": ["A spiral minaret", "The spiral points up like a question."], "IR": ["A blue-tiled dome", "Light inside falls in colours Marlowe tried to name."], "KW": ["Three needle towers", "Each holds a tiny light. One is out."], "QA": ["A sail-shaped tower", "The wind makes it hum a low C."], "OM": ["A grand mosque", "One huge chandelier, one enormous silence."], "SA": ["A skyscraper with a hole", "Marlowe: 'a door in the sky, naturally'."], "YE": ["Mud-brick towers", "Tall and ornate, like drawings by a very tidy child."], "ET": ["A rock-hewn church", "Carved downward from the top. She loved that."], "SD": ["Pyramids in the sand", "Smaller than Egypt's. Marlowe: 'modest, therefore interesting'."], "LY": ["Ancient arches by the sea", "A cat sleeps in the shade and does not recognise your authority."], "TN": ["An ancient seaside ruin", "'The sea keeps copies of everything,' she wrote."], "DZ": ["A white hillside city", "The streets are stacked like envelopes."], "MA": ["A tall minaret", "The tiles are patterned like a cipher."], "SN": ["A giant hilltop statue", "Two figures, one gaze. Sef composes a verse."], "GH": ["A whitewashed coastal fort", "Sea air, salt, and history that deserves listening to."], "NG": ["A great granite rock", "It rises from flat land like a punchline."], "KE": ["A snow-capped peak on the equator", "Priya refuses to believe in equatorial snow until she sees it."], "TZ": ["Africa's highest peak", "Tomas insists the summit is closer than it looks. It is not."], "ZW": ["Ancient stone walls", "No mortar. Kofi nearly fainted with delight."], "NA": ["Red dunes", "'Sand is just slow mountain,' Marlowe wrote."], "MG": ["An avenue of baobabs", "Trees upside down, roots in the sky. Tomas checked."], "MU": ["A great basalt mountain", "Clouds snag on its summit like laundry."], "NP": ["A white stupa with painted eyes", "The eyes follow you kindly."], "TH": ["A golden temple spire", "Gold leaf peels slightly. Marlowe stuck it back."], "VN": ["A river pagoda", "A bicycle bell rings below. A grey envelope is under the seat."], "MM": ["A golden pagoda", "It shines at dawn like a lighthouse for the soul."], "LK": ["A white dagoba", "Quiet, round and unbothered."], "MV": ["A palm-lined atoll", "Water so clear Marlowe drew the fish."], "BT": ["A cliffside monastery", "A cliff drawn with a very confident line."], "ID": ["A temple of many terraces", "Each terrace holds a tiny carved story."], "MY": ["Twin silver towers", "A sky-bridge between them, like a very tall handshake."], "SG": ["Gardens with giant tree towers", "Light-up trees. Priya wants one for her workshop."], "PH": ["A coral-stone church", "Bells at six, always slightly out of tune."], "KR": ["A palace gate", "A guard stands very still. Sef cannot make him laugh."], "KZ": ["A golden tower", "Wind combs the plains and the tower hums."], "UZ": ["A blue-tiled square", "Three domes and one very photogenic cat."], "PK": ["A white marble mosque", "Four minarets, no hurry."], "PW": ["A rock island lagoon", "Mushroom-shaped islands. Yuki approves."], "FJ": ["A palm-fringed bay", "The pigeon is already there. How?"], "WS": ["A white-sand cove", "'Sit here and do nothing, expertly,' Marlowe wrote."], "NZ": ["A snow-capped volcano", "Cone-shaped and polite."], "AR": ["A tall white obelisk", "It points upward like an enormous exclamation mark."], "UY": ["A coastal lighthouse", "Yuki asks if she can stay. Marlowe: 'maybe next time'."], "BO": ["A high plateau", "Thin air makes Tomas dramatic."], "CO": ["A mountain cathedral", "Carved in salt, and silent."], "VE": ["A flat-topped mountain with a waterfall", "The water falls so far it turns to mist."], "EC": ["A monument at the middle of the world", "Marlowe stood with a foot in each hemisphere: 'excellent for balance'."], "CU": ["A domed capitol", "Old cars below, like shiny punctuation."], "HT": ["A mountaintop citadel", "Thick walls, thicker clouds."], "DO": ["An old cathedral", "The oldest in the Americas, and it looks proud."], "GT": ["Jungle pyramids", "Birdsong echoes from the top. Sef writes it down."], "HN": ["A stair of carved glyphs", "Kofi stood before it for six hours."], "PA": ["A canal lock", "Ships rise like very slow lifts."], "CR": ["A cloud-forest volcano", "Mist and a coffee shop. Lucía cries."]});Object.keys(MONP).forEach(function(k){var m=MONP[k].match(/^@@(\w\w)@@$/);if(m)MONP[k]=MONP[m[1]]});Object.assign(BEAT,{"Edinburgh": [1, "Tomas finds a letter tucked behind a bagpipe. It says only: 'Wrong instrument. Try the kettle.' He tries the kettle. The kettle plays three notes. This is how the next clue begins."], "Oslo": [2, "Priya pulls a grey seal off an envelope with tweezers and a sigh. 'Machine-made,' she says, 'but pressed by hand afterwards, to look careless. It is the neatest carelessness I have ever seen.'"], "Warsaw": [3, "Kofi reads two letters back to back. The first sounds like Marlowe. The second sounds like Marlowe being corrected by someone who has never enjoyed a Tuesday."], "Lisbon": [7, "Sef finds a postcard from Marlowe tucked inside a fado record sleeve: 'Sing the sad parts loudly. They feel lighter outside.' He sings. The harbour listens."], "Prague": [0, "Marlowe: 'I wrote this on a bridge, surrounded by statues that have seen everything and told no one. I envy them.' The ink is smudged with either a tear or a drop of coffee."], "Budapest": [6, "Lucía discovers that the Hush's letters are always posted on Thursdays. 'Thursday is a suspicious day,' she says. 'It thinks it is Friday.'"], "Sofia": [2, "Priya finds a transmitter hidden inside a very old tram. It broadcasts one repeated sentence: 'Please be quieter.' She unplugs it, apologises to it, and plugs in a kettle."], "Istanbul": [3, "Kofi follows a trail of grey postcards across two continents in one ferry ride. 'Efficient,' he mutters, 'and rude.' At the end, a very small tea glass is engraved with Vane's initials."], "Ankara": [2, "A clerk hands Priya a package that arrived twenty years ago and was never collected. It holds one pigeon feather and a note: 'Hold onto this. You will know when.'"], "Doha": [3, "Kofi studies a grey envelope under a lamp. 'The forger presses too hard,' he says. 'He thinks if he writes firmly enough, it will become true.'"], "Freetown": [6, "Lucía learns that a woman in the market has kept Marlowe's old shopping list for years, in case she came back. It reads: 'bread, thread, courage'."], "Kinshasa": [7, "Sef hears a drum pattern that matches the numbers in the compass puzzle. The drummer grins. 'Everybody knows that one,' he says. 'It is the beat for knocking nicely.'"], "Kampala": [1, "Tomas, on a very slow bus, receives a parcel from a stranger who says: 'Marlowe said you would be late.' Tomas cannot decide whether to be flattered or offended."], "Lusaka": [3, "Kofi files three clues under 'It is definitely connected, I just cannot say how'. He gives the folder a serious label. It reads 'Vibes'."], "Maputo": [6, "Lucía cooks a stew with a secret ingredient: whatever happens to be nearby. 'That is the secret,' she says. 'Nobody knows what is nearby, so nobody can copy it.'"], "Almaty": [4, "Yuki finds a radio that picks up exactly one station: a woman reading letters aloud, in many languages. 'Marlowe,' Yuki says. 'She wrote them for the air.'"], "Beijing": [4, "In a quiet courtyard, a gardener hands Yuki a letter folded into a paper boat. 'She said to let the water carry it,' he says. They do, and it floats exactly where it needed to."], "Seoul": [7, "Sef plays an old tune and a street performer instantly plays the answering line. They have never met. It is the tune Marlowe hummed, according to everyone."], "Bangkok": [6, "Lucía tastes a street-food soup and declares it 'structurally perfect'. The vendor hands her a stamp that is on no official list. It is pressed in blue ink."], "Hanoi": [4, "Yuki spots a grey envelope under a bicycle seat. Whoever left it scattered their glasses in a hurry. Inside, a handwritten apology: 'Sorry for the quiet.'"], "Suva": [0, "Marlowe: 'This is the stop where I almost stopped. The sea was so loud and so kind that I thought: I could stay. Then I thought of you, and the next stamp, and it was easy to go on.'"], "Canberra": [2, "Priya searches a government archive and finds a file labelled 'Marlowe, Dr I. See also: Vane, A.' under the heading 'Do Not Alphabetise'. Kofi is not allowed to see it."], "Bogotá": [3, "Kofi works out the missing page: not a page of text but a page of silence, left blank on purpose for the reader to fill. 'Rude,' he says, delighted."], "Panama City": [1, "Tomas watches a ship pass through the canal, a very slow door opening. 'Some things are worth the wait,' he says quietly. Then he checks his watch."], "New York": [6, "Lucía carries soup through a blizzard to a lighthouse keeper who forgot to eat. The keeper turns out to be Vane's old teacher. 'The loudest child I ever taught,' she says, 'in his head.'"]});
OPN.push("The station clock in {s} is wrong in a way that feels deliberate.","{w} orders two teas in {s} and says one is for 'the pigeon'.","Rain starts at {s}, but only on the side of the street with the postbox.","At {s}, the stamp is cold and slightly damp, as if it has been somewhere.");
EVD.push("Left on a bench under a stone: {m}.","Handed over without a word: {m}.","Hidden inside the lining of a map: {m}.");

var LT=[["Dublin", "On trains", "I think best when the world moves and I do not. If you are anxious, sit by the window and count the poles. It is not avoidance. It is a method."], ["Vienna", "On rooms", "Aldous could not stand crowded rooms and I could not stand empty ones. We built a lab with one door and one window. It was the happiest year of my life."], ["Istanbul", "On masks", "I wore one for years. It was beautiful and it gave me a headache. If yours is heavy, put it down somewhere safe for an hour. See what stays."], ["Cairo", "On noise", "The world is loud, and some of us are built to hear all of it. That is not a flaw. It is an instrument. Learn what it plays."], ["Mumbai", "On interests", "If something lights you up, follow it. People may call it a phase. Call it a compass. Mine pointed at you."], ["Suva", "On rest", "Rest is not a reward. It is a requirement, like water. Please stop earning it. Please just take it."], ["Lima", "On Aldous", "I miss him more than I admit. He was not wrong to be afraid. He was wrong to think quiet had to mean hidden."], ["Halifax", "On you", "I do not know who you are, but I know you read the margins. That makes you patient, curious and probably tired. Thank you for coming this far."]],LI=[null, [2, "Chapter two. The roads get older and the stories get longer. Priya joins you with a suitcase of antennas and a very worried look. 'The grey seals started appearing here,' she says. 'Someone is rewriting Marlowe's letters, neatly. That is the unsettling part.'"], [3, "Chapter three. Mountains, markets and tea so strong it counts as an opinion. Kofi unpacks his archive in a café and declares it 'temporarily alphabetical'. 'The seal has a name behind it,' he says. 'I can feel it. It is on the tip of my index.'"], [6, "Chapter four. The longest stretch of the loop, and the warmest welcome. Lucía hands you a flask before you have said hello. 'Long roads need soup,' she says. 'And long mysteries need company. You will find both here.'
