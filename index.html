 return'<div class="panel" style="--c:'+a.c+'"><div class="ph"><span class="em">'+a.e+'</span><span><b>'+a.n+'</b><small style="display:block;color:var(--mute);font-size:13px">'+(n?RN[n-1]:"Unranked")+' · '+hm(x)+' practised</small></span></div><div class="path" style="--p:'+pp+'%">'+RN.map(function(r,i){return'<i class="nd'+(i<n?" on":"")+(i===n?" nxt":"")+'">'+(i+1)+'</i>'}).join("")+'</div><small style="color:var(--mute)">'+(nx?"Next: "+RN[n]+" in "+hm(nx-x):"Mastery reached.")+'</small><div class="goal" style="margin-top:10px">Learning outcomes for this skill will appear here.</div></div>'}).join("")}
function vCharter(){return'<h2>The Charter</h2><p class="sub">You are the Keeper of the Stronghold. Your daily upkeep carries you around the globe. Your hobbies build mastery.</p><details open><summary>Two tracks, no trading</summary><p>Tasks earn kilometres on the Eastbound Loop, a 2.5-year walk across every continent, one capital at a time. Hobbies earn Marks, one per hour. Neither is ever locked behind the other.</p></details><details><summary>Ignition Level</summary><p>Your level is your progress round the globe: 100 ranks, one per 1% of the whole route. It measures how often you start yourself.</p></details><details><summary>Law 1: Rest and hobbies are never earned</summary><p>They are always open. Chores move you forward, but they never buy your joy.</p></details><details><summary>Law 2: Action buys blueprints</summary><p>No planning, spreadsheets or gear research until one physical task is done.</p></details><details><summary>Law 3: The 8 PM curfew</summary><p>Work and tasks close. Protected time with Georgie.</p></details><div class="foot"><button class="btn" data-a="reset">Fresh day</button><button class="btn danger" data-a="wipe">Hard reset</button></div>'}
function render(){var t=tierDef();document.documentElement.style.setProperty("--tier","var("+t.c+")");
 var lv=lvOf(S.km);$("lvl").textContent="Ignition Level "+lv+" \u00b7 "+lname(lv);$("xpf").style.width=lprog(S.km)*100+"%";
 $("mks").textContent=S.mks;$("kmv").textContent=nf(S.km)+" km";
 [["cm",S.mks],["ck",Math.round(S.km)]].forEach(function(q){if(prev[q[0]]!==undefined&&prev[q[0]]!==q[1]){var c=$(q[0]);c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump")}prev[q[0]]=q[1]});
 var body={today:vToday,journey:vJourney,hobbies:vHobbies,skills:vSkills,charter:vCharter}[V]();
 $("app").innerHTML=(V==="today"?'<p class="say">'+banner()+'</p>':'')+body;
 $("nav").innerHTML=[["today","Today"],["journey","Journey"],["hobbies","Hobbies"],["skills","Skills"],["charter","Charter"]].map(function(n){return'<button data-a="view" data-id="'+n[0]+'"'+(V===n[0]?' aria-current="page"':'')+'>'+n[1]+'</button>'}).join("")}
function act(a,id,x){
 if(a==="view"){V=id;render();window.scrollTo(0,0);return}
 if(a==="tier")S.tier=id;
 else if(a==="convoy")S.convoy=!S.convoy;
 else if(a==="off")S.off=!S.off;
 else if(a==="duty"){var d=DL(S.tier).filter(function(q){return q.id===id})[0],on=!S.done[id];if(on){S.done[id]=1;addKm(K(d.m));say("+"+K(d.m)+" km. "+d.n+" complete.")}else{delete S.done[id];addKm(-K(d.m))}}
 else if(a==="bonus"){S.bonus++;addKm(K(45));say("+"+K(45)+" km. Bonus block logged.")}
 else if(a==="unbonus"){S.bonus--;addKm(-K(45))}
 else if(a==="rest")say("Rest taken. No cost, no guilt.");
 else if(a==="wish"){if(S.wishlist[id])delete S.wishlist[id];else{S.wishlist[id]=1;say("Added "+STOPS[id].n+" to your wishlist.")}}
 else if(a==="hlog"){var m=+x;S.hlog.push({id:id,m:m});var dm=hob(id,m);say(dm>0?"+"+dm+" Mark"+(dm>1?"s":"")+". "+m+" minutes logged.":m+" minutes logged.")}
 else if(a==="hundo"){for(var i=S.hlog.length-1;i>=0;i--)if(S.hlog[i].id===id){var u=S.hlog[i].m;S.hlog.splice(i,1);hob(id,-u);break}}
 else if(a==="claim"){S.claimed[id]=1;say("Reward claimed. Go and enjoy it.")}
 else if(a==="reset"){S.done={};S.hlog=[];S.bonus=0;S.tkm=0}
 else if(a==="wipe"){$("modal").hidden=false;$("mc").focus();return}
 else if(a==="cancel"){$("modal").hidden=true;return}
 else if(a==="hardreset"){S=fresh();prev={};V="today";$("modal").hidden=true;say("Fresh start. Your adventure begins again.")}
 save();render();if(up)say(up);if(fx||up)burst();fx=0;up=""}
document.addEventListener("click",function(e){var t=e.target.closest("[data-a]");if(t&&!t.disabled&&t.tagName!=="SELECT")act(t.dataset.a,t.dataset.id,t.dataset.m)});
document.addEventListener("change",function(e){if(e.target&&e.target.id==="gp-sel"){S.grandPick=e.target.value;save();render()}});
document.addEventListener("keydown",function(e){if(e.key==="Escape")$("modal").hidden=true});
setInterval(function(){if(V==="today"){var s=document.querySelector(".say");if(s)s.textContent=banner()}},60000);
render();
})();
</script>
