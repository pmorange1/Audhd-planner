<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Globetrotter Passport</title>
<meta name="theme-color" content="#0f2740" id="meta-theme">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Caveat:wght@600&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="hud">
  <div class="who" id="lvl"></div>
  <div class="xpbar"><i id="xpf"></i></div>
  <div class="chips">
    <button class="mute-btn" data-a="view" data-id="settings" aria-label="Settings"><svg class="ni" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg></button>
    <button class="mute-btn" id="mbtn" data-a="mute" title="Toggle sound" aria-label="Toggle sound">&#128266;</button>
    <span class="chip mk" id="cm"><i></i><b id="mks">0</b></span>
    <span class="chip km" id="ck"><i></i><b id="kmv">0 km</b></span>
  </div>
</header>
<main id="app"></main>
<nav id="nav" class="nav"></nav>
<div class="toast" id="toast" hidden role="status"></div>
<div class="modal" id="modal" hidden><div class="dlg" role="dialog" aria-modal="true"><div id="mb"></div></div></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
